<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .box-title { font-size: 13px; font-weight: 700; fill: #111827; }
      .box-sub { font-size: 10.5px; font-weight: 500; fill: #4b5563; }
      .label-text { font-size: 9.5px; font-weight: 600; fill: #374151; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="1020" height="540" fill="#ffffff" />

  <!-- 1. Candidate Resume (Top Left) -->
  <g transform="translate(50, 40)">
    <rect width="250" height="60" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="125" y="26" text-anchor="middle" class="box-title">Candidate Resume</text>
    <text x="125" y="44" text-anchor="middle" class="box-sub">PDF / DOCX Format</text>
  </g>

  <!-- Arrow: Candidate Resume -> Resume Parsing Engine -->
  <path d="M 300 70 L 368 70" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 2. Resume Parsing Engine (Top Center) -->
  <g transform="translate(370, 40)">
    <rect width="270" height="60" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="135" y="26" text-anchor="middle" class="box-title">Resume Parsing Engine</text>
    <text x="135" y="44" text-anchor="middle" class="box-sub">pdfplumber + spaCy NER</text>
  </g>

  <!-- Arrow: Resume Parsing Engine -> Structured Candidate Profile -->
  <path d="M 505 100 L 505 138" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 3. Target Job Role (Mid Left) -->
  <g transform="translate(50, 140)">
    <rect width="250" height="60" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="125" y="26" text-anchor="middle" class="box-title">Target Job Role</text>
    <text x="125" y="44" text-anchor="middle" class="box-sub">Industry Taxonomy / O*NET</text>
  </g>

  <!-- 4. Structured Candidate Profile (Mid Center) -->
  <g transform="translate(370, 140)">
    <rect width="270" height="60" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="135" y="26" text-anchor="middle" class="box-title">Structured Candidate Profile</text>
    <text x="135" y="44" text-anchor="middle" class="box-sub">Skills, Education, Projects</text>
  </g>

  <!-- Arrow: Target Job Role -> Skill Gap Engine -->
  <path d="M 175 200 L 175 258" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="125" y="220" width="100" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" />
  <text x="175" y="233" text-anchor="middle" class="label-text">Required Taxonomy</text>

  <!-- Arrow: Structured Candidate Profile -> Skill Gap Engine -->
  <path d="M 505 200 L 505 258" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="460" y="220" width="90" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" />
  <text x="505" y="233" text-anchor="middle" class="label-text">Extracted Skills</text>

  <!-- 5. Semantic Skill Gap Analysis Engine (Central Box) -->
  <g transform="translate(50, 260)">
    <rect width="590" height="70" rx="6" fill="#fcfcfc" stroke="#111827" stroke-width="1.8" />
    <text x="295" y="30" text-anchor="middle" class="box-title">Semantic Skill Gap Analysis Engine</text>
    <text x="295" y="50" text-anchor="middle" class="box-sub">Sentence-BERT Embeddings + Cosine Similarity + WSGS Computation</text>
  </g>

  <!-- Branching Arrows from Skill Gap Engine -->
  <path d="M 195 330 L 195 388" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <path d="M 495 330 L 495 388" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 6. Personalized Career Guidance (Bottom Left) -->
  <g transform="translate(50, 390)">
    <rect width="280" height="65" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="140" y="28" text-anchor="middle" class="box-title">Personalized Career Guidance</text>
    <text x="140" y="47" text-anchor="middle" class="box-sub">Curated Roadmap &amp; Skill Milestones</text>
  </g>

  <!-- 7. Mock Interview Preparation (Bottom Center) -->
  <g transform="translate(360, 390)">
    <rect width="280" height="65" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="140" y="28" text-anchor="middle" class="box-title">Mock Interview Preparation</text>
    <text x="140" y="47" text-anchor="middle" class="box-sub">Resume-Aware LLM Question Generator</text>
  </g>

  <!-- 8. Jobnity Dashboard (Right Column) -->
  <g transform="translate(730, 215)">
    <rect width="240" height="75" rx="6" fill="#f9fafb" stroke="#111827" stroke-width="1.8" />
    <text x="120" y="32" text-anchor="middle" class="box-title">Jobnity Dashboard</text>
    <text x="120" y="52" text-anchor="middle" class="box-sub">Unified Readiness &amp; Analytics</text>
  </g>

  <!-- Clean orthogonal routing into Jobnity Dashboard: NEVER intersects other boxes! -->
  <!-- Direct arrow from Mock Interview -> Dashboard -->
  <path d="M 640 422.5 L 680 422.5 L 680 265 L 718 265" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Clean routed line from Career Guidance along the bottom into Dashboard -->
  <path d="M 190 455 L 190 490 L 850 490 L 850 298" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="470" y="480" width="120" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" />
  <text x="530" y="493" text-anchor="middle" class="label-text">Career Roadmap Status</text>

  <!-- Direct arrow from Skill Gap Engine -> Dashboard -->
  <path d="M 640 240 L 718 240" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="645" y="222" width="65" height="16" rx="2" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8" />
  <text x="677" y="233" text-anchor="middle" class="label-text">Gap Scores</text>
</svg>