<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #111827; }
      .box-sub { font-size: 11px; font-weight: 500; fill: #4b5563; }
      .label-text { font-size: 10px; font-weight: 600; fill: #374151; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="920" height="620" fill="#ffffff" />

  <!-- 1. Candidate Resume -->
  <g transform="translate(60, 30)">
    <rect width="250" height="60" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="125" y="26" text-anchor="middle" class="box-title">Candidate Resume</text>
    <text x="125" y="44" text-anchor="middle" class="box-sub">PDF / DOCX Format</text>
  </g>

  <!-- Arrow: Candidate Resume -> Resume Parsing Engine -->
  <path d="M 310 60 L 378 60" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 2. Resume Parsing Engine -->
  <g transform="translate(380, 30)">
    <rect width="270" height="60" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="135" y="26" text-anchor="middle" class="box-title">Resume Parsing Engine</text>
    <text x="135" y="44" text-anchor="middle" class="box-sub">pdfplumber + spaCy NER</text>
  </g>

  <!-- Arrow: Resume Parsing Engine -> Structured Candidate Profile -->
  <path d="M 515 90 L 515 128" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 3. Target Job Role -->
  <g transform="translate(60, 130)">
    <rect width="250" height="60" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="125" y="26" text-anchor="middle" class="box-title">Target Job Role</text>
    <text x="125" y="44" text-anchor="middle" class="box-sub">Industry Taxonomy / O*NET</text>
  </g>

  <!-- 4. Structured Candidate Profile -->
  <g transform="translate(380, 130)">
    <rect width="270" height="60" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="135" y="26" text-anchor="middle" class="box-title">Structured Candidate Profile</text>
    <text x="135" y="44" text-anchor="middle" class="box-sub">Skills, Education, Projects</text>
  </g>

  <!-- Arrow: Target Job Role -> Skill Gap Analysis Engine -->
  <path d="M 185 190 L 185 248" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="135" y="210" width="100" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" />
  <text x="185" y="223" text-anchor="middle" class="label-text">Required Taxonomy</text>

  <!-- Arrow: Structured Candidate Profile -> Skill Gap Analysis Engine -->
  <path d="M 515 190 L 515 248" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="470" y="210" width="90" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" />
  <text x="515" y="223" text-anchor="middle" class="label-text">Extracted Skills</text>

  <!-- 5. Semantic Skill Gap Analysis Engine -->
  <g transform="translate(60, 250)">
    <rect width="590" height="70" rx="6" fill="#fcfcfc" stroke="#111827" stroke-width="1.8" />
    <text x="295" y="30" text-anchor="middle" class="box-title">Semantic Skill Gap Analysis Engine</text>
    <text x="295" y="50" text-anchor="middle" class="box-sub">Sentence-BERT Embeddings + Cosine Similarity + WSGS Computation</text>
  </g>

  <!-- Branching Arrows from Skill Gap Engine -->
  <path d="M 205 320 L 205 378" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <path d="M 505 320 L 505 378" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 6. Personalized Career Guidance -->
  <g transform="translate(60, 380)">
    <rect width="290" height="65" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="145" y="28" text-anchor="middle" class="box-title">Personalized Career Guidance</text>
    <text x="145" y="47" text-anchor="middle" class="box-sub">Curated Roadmap &amp; Skill Milestones</text>
  </g>

  <!-- 7. Mock Interview Preparation -->
  <g transform="translate(360, 380)">
    <rect width="290" height="65" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <text x="145" y="28" text-anchor="middle" class="box-title">Mock Interview Preparation</text>
    <text x="145" y="47" text-anchor="middle" class="box-sub">Resume-Aware LLM Question Generator</text>
  </g>

  <!-- Clean Converging Arrows into Jobnity Dashboard -->
  <!-- Left branch arrow into left side of Dashboard -->
  <path d="M 205 445 L 205 525 L 228 525" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Right branch arrow into right side of Dashboard -->
  <path d="M 505 445 L 505 525 L 482 525" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 8. Jobnity Dashboard (Converging Center) -->
  <g transform="translate(230, 495)">
    <rect width="250" height="60" rx="6" fill="#f9fafb" stroke="#111827" stroke-width="1.8" />
    <text x="125" y="26" text-anchor="middle" class="box-title">Jobnity Dashboard</text>
    <text x="125" y="44" text-anchor="middle" class="box-sub">Unified Readiness &amp; Analytics</text>
  </g>
</svg>