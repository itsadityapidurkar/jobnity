<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .box-title { font-size: 13.5px; font-weight: 700; fill: #111827; }
      .box-sub { font-size: 10.5px; font-weight: 500; fill: #4b5563; }
      .label-text { font-size: 9.5px; font-weight: 600; fill: #111827; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff" />

  <!-- 1. Client Presentation Layer (Top) -->
  <g transform="translate(180, 25)">
    <rect width="600" height="62" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <text x="300" y="26" text-anchor="middle" class="box-title">Client Presentation Layer (React.js + Tailwind CSS)</text>
    <text x="300" y="46" text-anchor="middle" class="box-sub">Speech Recognition API (STT) | Audio Synthesis (TTS) | Responsive UI</text>
  </g>

  <!-- Arrow: Client -> Gateway -->
  <path d="M 480 87 L 480 148" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <rect x="405" y="108" width="150" height="18" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1" />
  <text x="480" y="121" text-anchor="middle" class="label-text">REST API (JSON / HTTP)</text>

  <!-- 2. Application Gateway (FastAPI Backend Server) -->
  <g transform="translate(180, 150)">
    <rect width="600" height="62" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <text x="300" y="26" text-anchor="middle" class="box-title">Application Gateway (FastAPI Backend Server)</text>
    <text x="300" y="46" text-anchor="middle" class="box-sub">Request Validation (Pydantic) | Authentication (JWT) | Pipeline Controller</text>
  </g>

  <!-- Arrows: Gateway -> 4 Modules -->
  <path d="M 270 212 L 157.5 273" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <path d="M 410 212 L 372.5 273" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <path d="M 550 212 L 587.5 273" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <path d="M 690 212 L 802.5 273" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 3. The 4 Functional Modules -->
  <!-- 3A: NLP Parsing -->
  <g transform="translate(60, 275)">
    <rect width="195" height="74" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <text x="97.5" y="24" text-anchor="middle" class="box-title">NLP Parsing</text>
    <text x="97.5" y="44" text-anchor="middle" class="box-sub">spaCy 3.7 NER</text>
    <text x="97.5" y="60" text-anchor="middle" class="box-sub">Transformer Tokenizer</text>
  </g>

  <!-- 3B: Semantic Engine -->
  <g transform="translate(275, 275)">
    <rect width="195" height="74" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <text x="97.5" y="24" text-anchor="middle" class="box-title">Semantic Engine</text>
    <text x="97.5" y="44" text-anchor="middle" class="box-sub">Sentence-BERT</text>
    <text x="97.5" y="60" text-anchor="middle" class="box-sub">all-MiniLM-L6-v2</text>
  </g>

  <!-- 3C: LLM Synthesis -->
  <g transform="translate(490, 275)">
    <rect width="195" height="74" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <text x="97.5" y="24" text-anchor="middle" class="box-title">LLM Synthesis</text>
    <text x="97.5" y="44" text-anchor="middle" class="box-sub">LangChain + LLM API</text>
    <text x="97.5" y="60" text-anchor="middle" class="box-sub">Resume-Aware Prompts</text>
  </g>

  <!-- 3D: Evaluation Core -->
  <g transform="translate(705, 275)">
    <rect width="195" height="74" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <text x="97.5" y="24" text-anchor="middle" class="box-title">Evaluation Core</text>
    <text x="97.5" y="44" text-anchor="middle" class="box-sub">Scoring Engine</text>
    <text x="97.5" y="60" text-anchor="middle" class="box-sub">WSGS &amp; MAE Analysis</text>
  </g>

  <!-- Arrows: 4 Modules -> Data Persistence Layer -->
  <path d="M 157.5 349 L 270 417" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <path d="M 372.5 349 L 410 417" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <path d="M 587.5 349 L 550 417" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />
  <path d="M 802.5 349 L 690 417" fill="none" stroke="#111827" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- 4. Data Persistence Layer (Bottom) -->
  <g transform="translate(180, 420)">
    <rect width="600" height="62" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <text x="300" y="26" text-anchor="middle" class="box-title">Data Persistence Layer</text>
    <text x="300" y="46" text-anchor="middle" class="box-sub">PostgreSQL (Users, Profiles, Scores) | MongoDB &amp; Vector Cache (Embeddings)</text>
  </g>
</svg>